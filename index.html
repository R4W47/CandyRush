<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candy Rush</title>
  <meta name="theme-color" content="#f9a9b8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <!-- ===== PORTADA ===== -->
  <section id="home" class="screen home" hidden>
    <div class="home-card">
      <div id="logoCandies" class="logo-candies" aria-hidden="true"></div>
      <h1 class="logo">Candy<br>Rush</h1>
      <p class="home-stars"><span class="mini-star earned"></span> <strong id="homeStars">0</strong> estrellas</p>
      <button id="homePlay" class="big-btn primary" type="button">Jugar · Nivel <span id="homeLevel">1</span></button>
      <button id="homeMap" class="big-btn" type="button">Niveles</button>
    </div>
  </section>

  <!-- ===== MAPA DE NIVELES ===== -->
  <section id="map" class="screen map" hidden>
    <header class="map-bar">
      <button id="mapBack" class="back-btn" type="button" aria-label="Volver a la portada">‹</button>
      <h2>Niveles</h2>
      <div class="map-stars"><span class="mini-star earned"></span> <strong id="mapStars">0</strong></div>
    </header>
    <div id="mapScroll" class="map-scroll">
      <div id="mapPath" class="map-path"></div>
    </div>
  </section>

  <!-- ===== JUEGO ===== -->
  <main id="game" class="screen game" hidden>
    <header class="hud">
      <div class="hud-top">
        <button id="gameBack" class="back-btn small" type="button" aria-label="Volver al mapa">‹ Mapa</button>
        <h1>Candy Rush</h1>
        <span class="hud-spacer"></span>
      </div>
      <div class="stats">
        <div class="stat"><span>Nivel</span><strong id="levelNum">1</strong></div>
        <div class="stat moves" id="movesBox"><span>Movimientos</span><strong id="moves">0</strong></div>
        <div class="stat" id="scoreBox"><span>Puntos</span><strong id="score">0</strong></div>
      </div>
      <div class="goal">
        <div class="goal-bar" aria-hidden="true">
          <div id="goalFill" class="goal-fill"></div>
          <span id="goalMark1" class="goal-mark"></span>
          <span id="goalMark2" class="goal-mark"></span>
          <span id="goalMark3" class="goal-mark"></span>
        </div>
        <div class="goal-text">Objetivo <strong id="target">0</strong></div>
      </div>
    </header>

    <div class="board-frame">
      <div id="board" class="board" aria-label="Tablero de caramelos"></div>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <button id="restart" class="restart" type="button">Reiniciar nivel</button>
  </main>

  <div id="result" class="game-over" hidden>
    <div class="game-over-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <h2 id="resultTitle"></h2>
      <div class="result-stars" id="resultStars" aria-hidden="true">
        <span class="star"></span><span class="star big"></span><span class="star"></span>
      </div>
      <p id="resultText"></p>
      <p class="final-score">Puntaje: <strong id="finalScore">0</strong></p>
      <p class="best-score">Récord del nivel: <strong id="bestScore">0</strong></p>
      <div class="game-over-actions">
        <button id="resultPrimary" class="restart primary" type="button"></button>
        <button id="resultSecondary" class="restart" type="button"></button>
        <button id="exitGame" class="restart" type="button">Mapa</button>
      </div>
    </div>
  </div>

  <!-- Tarjeta que aparece al tocar un nivel en el mapa -->
  <div id="levelCard" class="game-over" hidden>
    <div class="game-over-card level-card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
      <h2 id="cardTitle">Nivel 1</h2>
      <p id="cardZone" class="card-zone"></p>
      <div class="result-stars" id="cardStars" aria-hidden="true">
        <span class="star"></span><span class="star big"></span><span class="star"></span>
      </div>
      <div class="card-info">
        <div><span>Objetivo</span><strong id="cardTarget">0</strong></div>
        <div><span>Movimientos</span><strong id="cardMoves">0</strong></div>
        <div><span>Récord</span><strong id="cardBest">—</strong></div>
      </div>
      <div class="game-over-actions">
        <button id="cardPlay" class="restart primary" type="button">Jugar</button>
        <button id="cardClose" class="restart" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="rotate-notice" role="alert">
    <div class="phone" aria-hidden="true">📱</div>
    <p>Gira tu teléfono en vertical para jugar</p>
  </div>

  <script src="script.js?v=14"></script>
</body>
</html>
